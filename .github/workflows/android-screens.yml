# 渲染 APP 各页面截图（模拟版、演示数据，Robolectric），作为构建产物 screens 上传，供不装手机也能看界面。
# 本地同样可跑：cd android && ./gradlew :app:testSimDemoUnitTest -Pscreens --tests '*DemoScreensTest'
name: android-screens

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android-screens.yml"
  workflow_dispatch:
    inputs:
      print:
        description: "把截图以 base64 打进日志（构建产物下载不了时用）"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  screens:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: 渲染截图
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:testSimDemoUnitTest -Pscreens --tests '*DemoScreensTest'
      - uses: actions/upload-artifact@v4
        with:
          name: screens
          path: android/app/build/screens/**/*.png
          if-no-files-found: error
      - name: 截图打进日志
        if: ${{ inputs.print }}
        run: |
          cd app/build/screens
          for f in $(find . -name '*.png' | sort); do echo "==FILE $f"; base64 -w 0 "$f"; echo; echo "==END"; done
