# 部署用：MySQL + 后端 + 站点（Web 管理端、/api 转发、APK 下载）。一条命令起全套：
#   cp deploy/.env.example deploy/.env      # 第一次：按里面的说明改好
#   docker compose -f deploy/compose.yml up -d --build
# 浏览器打开 http://<服务器地址>:${EGG_WEB_PORT}；只有站点对外，数据库与后端不开放端口。
# 开发用的库见 compose.dev.yml。
name: egg

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: ${EGG_DB_ROOT_PASSWORD:?在 deploy/.env 里填 EGG_DB_ROOT_PASSWORD（参照 deploy/.env.example）}
      MYSQL_DATABASE: ${EGG_DB_NAME:-egg}
      MYSQL_USER: ${EGG_DB_USER:-egg}
      MYSQL_PASSWORD: ${EGG_DB_PASSWORD:?在 deploy/.env 里填 EGG_DB_PASSWORD（参照 deploy/.env.example）}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 3s
      timeout: 3s
      retries: 40

  backend:
    build:
      context: ../backend
      dockerfile: ../deploy/backend.Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      LANG: C.UTF-8
      TZ: Asia/Shanghai
      EGG_DB_URL: jdbc:mysql://mysql:3306/${EGG_DB_NAME:-egg}?characterEncoding=utf8&connectionTimeZone=Asia/Shanghai
      EGG_DB_USER: ${EGG_DB_USER:-egg}
      EGG_DB_PASSWORD: ${EGG_DB_PASSWORD}
      EGG_SEED_DEMO: ${EGG_SEED_DEMO:-false}
      EGG_ADMIN_PHONE: ${EGG_ADMIN_PHONE:-}
      EGG_ADMIN_PASSWORD: ${EGG_ADMIN_PASSWORD:-}
      EGG_ADMIN_NAME: ${EGG_ADMIN_NAME:-管理员}
      CHANJET_MODE: ${CHANJET_MODE:-fake}
      CHANJET_BASE_URL: ${CHANJET_BASE_URL:-https://openapi.chanjet.com}
      CHANJET_APP_KEY: ${CHANJET_APP_KEY:-}
      CHANJET_APP_SECRET: ${CHANJET_APP_SECRET:-}
      CHANJET_BOOK_ID: ${CHANJET_BOOK_ID:-}
      CHANJET_OPEN_TOKEN: ${CHANJET_OPEN_TOKEN:-}
      CHANJET_CERTIFICATE: ${CHANJET_CERTIFICATE:-}
      CHANJET_TOKEN_MODE: ${CHANJET_TOKEN_MODE:-auto}
    healthcheck:
      # 镜像里没有 curl，用 bash 自带的 /dev/tcp 探端口
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080'"]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 20s

  web:
    build:
      context: ../web
      dockerfile: ../deploy/web.Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${EGG_WEB_PORT:-80}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # 最新 APK 与 version.json，由 deploy/publish-apk.sh 写入，不用重启
      - ./apk:/usr/share/nginx/apk:ro

volumes:
  mysql-data:
