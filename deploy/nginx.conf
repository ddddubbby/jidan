server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Web 管理端：前端路由用 history 模式，找不到文件就回 index.html
    location / {
        try_files $uri /index.html;
    }
    # 带哈希的构建产物可以长期缓存，入口页不缓存，发新版后刷新即生效
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # 接口：原样转给后端（后端自己带 /api 前缀）
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # APP 新版本入口（开发规格 2.7、5.2）。version.json 由 deploy/publish-apk.sh 写在 apk 目录里，
    # 里面的 __BASE__ 在这里换成手机访问站点用的地址，下载链接才是手机点得开的完整地址。
    # 没发布过 APK 时这里是 404，APP 会把下载入口藏起来。
    location = /api/app/version {
        alias /usr/share/nginx/apk/version.json;
        default_type application/json;
        sub_filter '__BASE__' '$scheme://$http_host';
        sub_filter_types application/json;
        sub_filter_once off;
        add_header Cache-Control "no-store";
    }

    # 开放平台校验消息接收地址用的文件（Token 安全级别“高”，指南 5.3）：放在 deploy/chanjet-check/，不入库
    location ~ ^/(CHANJET_CHECK[^/]*\.txt)$ {
        alias /usr/share/nginx/chanjet-check/$1;
        default_type text/plain;
        add_header Cache-Control "no-store";
    }

    # 最新 APK 的下载地址
    location /apk/ {
        alias /usr/share/nginx/apk/;
        add_header Cache-Control "no-store";
    }
}
