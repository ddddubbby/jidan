# 配置全部可用环境变量覆盖；默认值对应本机 MySQL 8.4（localhost:3306 的 egg 库，账号 egg/egg），见 doc/本地启动指南-无Docker.md
spring:
  application:
    name: egg-backend
  datasource:
    url: ${EGG_DB_URL:jdbc:mysql://localhost:3306/egg?characterEncoding=utf8&connectionTimeZone=Asia/Shanghai}
    username: ${EGG_DB_USER:egg}
    password: ${EGG_DB_PASSWORD:egg}
  jackson:
    time-zone: Asia/Shanghai

server:
  port: ${EGG_PORT:8080}

mybatis-plus:
  global-config:
    banner: false
    db-config:
      id-type: auto

egg:
  # 库里没有业务数据时写入一套演示数据（开发规格 7.3）。开发与模拟模式默认开；
  # 正式部署设 EGG_SEED_DEMO=false。
  seed-demo: ${EGG_SEED_DEMO:true}

  # 好生意对接（开发规格 3.5）。mode 为 fake（默认，模拟好生意）或 real；
  # real 下面四项密钥可以不填，服务照常启动，同步与回传时会提示缺哪几项。
  chanjet:
    mode: ${CHANJET_MODE:fake}
    base-url: ${CHANJET_BASE_URL:https://openapi.chanjet.com}
    app-key: ${CHANJET_APP_KEY:}
    app-secret: ${CHANJET_APP_SECRET:}
    book-id: ${CHANJET_BOOK_ID:}
    open-token: ${CHANJET_OPEN_TOKEN:}
    certificate: ${CHANJET_CERTIFICATE:}
    token-mode: ${CHANJET_TOKEN_MODE:auto}

  # 初始管理员（开发规格 7.2）：启动时库里没有任何管理员才建；已有管理员时这三项不起作用。
  admin:
    phone: ${EGG_ADMIN_PHONE:}
    password: ${EGG_ADMIN_PASSWORD:}
    name: ${EGG_ADMIN_NAME:管理员}
