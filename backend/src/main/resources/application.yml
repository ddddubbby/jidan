# 配置全部可用环境变量覆盖；默认值对应本机 MySQL 8.4（localhost:3306 的 egg 库，账号 egg/egg），见 doc/本地启动指南-无Docker.md
spring:
  application:
    name: egg-backend
  datasource:
    url: ${EGG_DB_URL:jdbc:mysql://localhost:3306/egg?characterEncoding=utf8&connectionTimeZone=Asia/Shanghai}
    username: ${EGG_DB_USER:root}
    password: ${EGG_DB_PASSWORD:123456}
  jackson:
    time-zone: Asia/Shanghai

server:
  port: ${EGG_PORT:8080}

mybatis-plus:
  global-config:
    banner: false
    db-config:
      id-type: auto

egg:
  # 库里没有业务数据时写入一套演示数据（开发规格 7.3）。开发与模拟模式默认开；
  # 正式部署设 EGG_SEED_DEMO=false。
  seed-demo: ${EGG_SEED_DEMO:false}

  # 好生意对接（开发规格 3.5）。mode 为 fake（默认，模拟好生意）或 real；
  # real 下面四项密钥可以不填，服务照常启动，同步与回传时会提示缺哪几项。
  chanjet:
#    mode: ${CHANJET_MODE:fake}
    mode: ${CHANJET_MODE:real}
    base-url: ${CHANJET_BASE_URL:https://openapi.chanjet.com}
    app-key: ${CHANJET_APP_KEY:mkVGsS3Q}
    app-secret: ${CHANJET_APP_SECRET:3BFFAA922CECB3A69E72CBD0D29610CE}
    book-id: ${CHANJET_BOOK_ID:3642068771802548}
    open-token: ${CHANJET_OPEN_TOKEN:eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..XEA2agbMAAmzhF_cuzC1OuBZJSgUVnGCq_4-xUMmA9o}
    certificate: ${CHANJET_CERTIFICATE:Jf+LmYUqM4F0mCc3pvFY8nAgsvqljTGd6kgrzZoeHnMZ2xB13w7pSEo6oNT9om1zUwnPnWQNvG9++eps8/D7o4IhHuVA2gPpSqW9Pwqecx61/6GQJUl7RvjkYtCFRsErilcjb0Fle2ktGUUmuyNtGJcpHTo+o1WXSxbce4s6JSRRLEwRH9hX+JfkSzRsBces}
    # 开放平台给自建应用的“消息加解密密钥”：Token 安全级别“高”时解开推来的 appTicket
    encrypt-key: ${CHANJET_ENCRYPT_KEY:}
    token-mode: ${CHANJET_TOKEN_MODE:static}

  # 初始管理员（开发规格 7.2）：启动时库里没有任何管理员才建；已有管理员时这三项不起作用。
  admin:
    phone: ${EGG_ADMIN_PHONE:}
    password: ${EGG_ADMIN_PASSWORD:}
    name: ${EGG_ADMIN_NAME:管理员}
