<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>收蛋 APP 模拟</title>
<style>
:root {
  --bg: #eceee9;
  --surface: #ffffff;
  --sunken: #f4f5f2;
  --ink: #14181a;
  --ink-2: #4a5357;
  --line: #d5d9d3;
  --edge: #8b9590;
  --accent: #0b6b3a;
  --accent-press: #095a31;
  --ok-bg: #e1f2e6;
  --ok-ink: #0a5a31;
  --warn-bg: #fff1cf;
  --warn-ink: #734600;
  --err-bg: #fde4e1;
  --err-ink: #9c1f18;
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --ease-drawer: cubic-bezier(0.32, 0.72, 0, 1);
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 16px/1.5 system-ui, -apple-system, "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
  -webkit-font-smoothing: antialiased;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; touch-action: manipulation; user-select: none; -webkit-tap-highlight-color: transparent; }

.stage {
  display: flex; flex-wrap: wrap; gap: 32px;
  justify-content: center; align-items: flex-start;
  padding: 24px 16px 96px;
}

/* ---------- 手机 ---------- */
.phone {
  position: relative; flex: none;
  width: 390px; max-width: 100%; height: 800px;
  background: var(--surface);
  border: 10px solid #1d2123; border-radius: 40px;
  overflow: hidden;
}
#app { height: 100%; display: flex; flex-direction: column; }
.phone[data-large] #app, .phone[data-large] .sheet { zoom: 1.3; }

.topbar { flex: none; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.topbar-row { display: flex; align-items: flex-start; gap: 4px; }
.topbar h1 { margin: 0; min-width: 0; font-size: 18px; font-weight: 700; line-height: 1.3; overflow-wrap: anywhere; }
.topbar p { margin: 2px 0 0; font-size: 13px; color: var(--ink-2); overflow-wrap: anywhere; }
.back {
  flex: none; width: 44px; height: 44px; margin: -10px 0 -10px -12px;
  border: 0; border-radius: 12px; background: none;
  font-size: 28px; line-height: 1; color: var(--ink);
}
.back:active { background: var(--sunken); }
.body { flex: 1; min-height: 0; overflow-y: auto; padding: 16px; }
.footer {
  flex: none; padding: 12px 16px 16px;
  border-top: 1px solid var(--line); background: var(--surface);
  display: flex; gap: 10px;
}
.pair { display: flex; gap: 10px; }
.pair > * { flex: 1; min-width: 0; }

.label { display: block; margin: 0 0 6px; font-size: 13px; font-weight: 600; color: var(--ink-2); }
.group { margin-bottom: 18px; }
.input, .select {
  width: 100%; height: 52px; padding: 0 14px;
  border: 1.5px solid var(--edge); border-radius: 12px;
  background: var(--surface); font-size: 18px;
}
.input:focus-visible, .select:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.btn {
  flex: 1; min-height: 56px; padding: 6px 16px;
  border: 1.5px solid var(--edge); border-radius: 14px;
  background: var(--surface); font-size: 17px; font-weight: 600; line-height: 1.25;
  transition: transform 120ms var(--ease-out);
}
.btn:active { transform: scale(0.97); background: var(--sunken); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:active { background: var(--accent-press); }
.btn.danger { color: var(--err-ink); border-color: var(--err-ink); }
.btn.dark { background: var(--ink); border-color: var(--ink); color: #fff; }
.btn.ghost-link { border-color: transparent; background: none; color: var(--ink-2); }
.btn.ghost-link.red { color: var(--err-ink); }
.btn.small { min-height: 44px; font-size: 15px; flex: none; }
.btn:disabled { background: #e3e6e1; border-color: #e3e6e1; color: #6b7471; cursor: default; transform: none; }
.pair > .btn { flex: 1 1 0; }

.seg { display: grid; grid-template-columns: repeat(var(--cols, 2), minmax(0, 1fr)); gap: 8px; }
.seg button {
  min-height: 48px; padding: 6px 10px; overflow-wrap: anywhere;
  border: 1.5px solid var(--edge); border-radius: 12px;
  background: var(--surface); font-size: 16px; font-weight: 600; line-height: 1.25;
  transition: transform 120ms var(--ease-out);
}
.seg button:active { transform: scale(0.97); }
.seg button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: #fff; }
.seg button small { display: block; margin-top: 2px; font-size: 12px; font-weight: 600; color: var(--ok-ink); }
.seg button small.warn { color: var(--warn-ink); }
.seg button[aria-pressed="true"] small { color: #fff; }

/* 建单步骤：同一时间只展开一步，填完的收成一行 */
.steps { list-style: none; margin: 0; padding: 0; }
.step { position: relative; padding: 0 0 6px 46px; }
.step:not(:last-child)::before {                       /* 串起各步的竖线 */
  content: ""; position: absolute; left: 15px; top: 34px; bottom: -2px; width: 2px; background: var(--line);
}
.step-num {
  position: absolute; left: 2px; top: 3px; width: 28px; height: 28px; border-radius: 50%;
  display: grid; place-items: center;
  border: 2px solid #a3aba6; background: var(--surface); color: #6b7471;
  font-size: 15px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums;
}
.step-title { margin: 0; font-size: 15px; font-weight: 600; line-height: 34px; color: #6b7471; }
.step[data-state="done"] .step-num { border-color: var(--ok-bg); background: var(--ok-bg); color: var(--ok-ink); }
.step[data-state="active"] .step-num { border-color: var(--accent); background: var(--accent); color: #fff; }
.step-card {
  margin: 0 0 10px -10px; padding: 0 12px 14px 10px;
  border: 2px solid var(--accent); border-radius: 14px; background: #f3f9f5;
}
.step[data-state="active"] .step-title { font-size: 17px; font-weight: 700; color: var(--ok-ink); line-height: 34px; }
.step-done { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: start; gap: 0 10px; padding: 4px 0 10px; min-height: 44px; }
.step-done .hints { grid-column: 1 / -1; }
.step-done .step-label { font-size: 13px; color: var(--ink-2); line-height: 26px; }
.step-done .row-main { margin-top: -2px; }
.step-done .btn { flex: none; min-height: 40px; padding: 4px 14px; font-size: 15px; }
.step-hint { display: block; margin: 4px 0 0; font-size: 13px; font-weight: 600; overflow-wrap: anywhere; }
.step-hint.ok { color: var(--ok-ink); }
.step-hint.warn { color: var(--warn-ink); }
.step .list { margin-top: 4px; background: var(--surface); }
.step .input { border-color: var(--accent); }
.btn.todo { background: var(--surface); border-color: var(--accent); color: var(--ok-ink); }

/* —— 建单页：字号层级 13 / 15 / 17 / 19 / 26，步骤行等高，竖线随进度变绿 —— */
.scr-create .topbar { padding: 20px 20px 14px; border-bottom: 0; }
.scr-create .topbar h1 { font-size: 26px; line-height: 1.2; letter-spacing: -0.01em; }
.scr-create .topbar p { margin-top: 4px; font-size: 15px; }
.scr-create .body { display: flex; flex-direction: column; padding: 4px 20px 16px; }
.scr-create .step { padding-left: 50px; }
.scr-create .step:not(:last-child)::before { left: 15px; top: 46px; bottom: -14px; background: var(--line); }
.scr-create .step[data-state="done"]:not(:last-child)::before { background: var(--accent); }
.scr-create .step-num { left: 0; top: 14px; width: 32px; height: 32px; font-size: 16px; }
.scr-create .step[data-state="active"] .step-num { top: 18px; }
.scr-create .step[data-state="done"] .step-num { top: 20px; border-color: var(--accent); background: var(--accent); color: #fff; }
.scr-create .step-title { font-size: 17px; font-weight: 600; line-height: 60px; color: #7a837f; }
.scr-create .step[data-state="active"] .step-title { font-size: 19px; line-height: 28px; margin: 0 0 12px; }
.scr-create .step-card { margin: 8px 0 14px -12px; padding: 14px 14px 16px 12px; border-radius: 16px; }
.step-row {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 0 12px;
  width: 100%; min-height: 72px; padding: 12px 0; border: 0; background: none; text-align: left;
}
.step-row:active { background: var(--sunken); }
.step-row .step-label { display: block; font-size: 13px; line-height: 18px; color: var(--ink-2); }
.step-row .step-value { display: block; font-size: 19px; font-weight: 600; line-height: 1.35; overflow-wrap: anywhere; }
.step-row .step-sub { display: block; font-size: 15px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.step-row .chev { font-size: 24px; line-height: 1; color: #a3aba6; }
.step-row .hints { grid-column: 1 / -1; }
.scr-create .seg button { min-height: 56px; font-size: 17px; border-radius: 14px; }
.scr-create .seg button small { font-size: 13px; }
.scr-create .list { border-radius: 14px; }
.scr-create .row-btn { min-height: 64px; }
.scr-create .row-main { font-size: 17px; }
.scr-create .row-sub { font-size: 15px; }
.scr-create .label { font-size: 15px; font-weight: 600; margin: 0 0 8px; }
.scr-create .note { font-size: 15px; }
.scr-create .footer { border-top: 0; padding: 8px 20px 20px; }
.scr-create .footer .btn { min-height: 60px; font-size: 18px; border-radius: 16px; }
.dev-card { margin-top: auto; border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
.dev-wrap { padding-top: 24px; margin-top: auto; }
.dev-line {
  display: flex; align-items: center; gap: 10px; width: 100%; min-height: 56px; padding: 8px 16px;
  border: 0; background: var(--surface); text-align: left; font-size: 17px;
}
.dev-line + .dev-line { border-top: 1px solid var(--line); }
.dev-line:active { background: var(--sunken); }
.dev-line .name { font-weight: 600; white-space: nowrap; }
.dev-line .model { flex: 1; min-width: 0; font-size: 13px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dev-line .st { flex: none; font-size: 15px; font-weight: 600; }
.dev-line .st.ok { color: var(--ok-ink); } .dev-line .st.warn { color: var(--warn-ink); } .dev-line .st.err { color: var(--err-ink); } .dev-line .st.busy { color: var(--ink-2); }
.dev-line .dot { margin-right: 0; }
.dev-line .dot.warn { background: var(--warn-ink); }
/* 正向反馈：填完一步圆标弹一下；全部填完按钮亮起来。一天几十次，所以轻、快 */
@keyframes pop { from { transform: scale(0.55); } to { transform: scale(1); } }
.step-num.pop { animation: pop 220ms var(--ease-out); }
@keyframes ready { from { transform: scale(0.96); box-shadow: 0 0 0 0 rgba(11, 107, 58, 0.45); } to { transform: none; box-shadow: 0 0 0 12px rgba(11, 107, 58, 0); } }
.btn.ready-in { animation: ready 260ms var(--ease-out); }
@keyframes shake { 0%, 100% { transform: none; } 20% { transform: translateX(-8px); } 40% { transform: translateX(7px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(3px); } }
.otp.bad { animation: shake 360ms ease-out; }
.otp.bad .cell { border-color: var(--err-ink); color: var(--err-ink); }

.list { list-style: none; margin: 8px 0 0; padding: 0; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.list li + li { border-top: 1px solid var(--line); }
.row-btn {
  display: flex; width: 100%; min-height: 60px; padding: 8px 14px;
  align-items: center; justify-content: space-between; gap: 12px;
  border: 0; background: var(--surface); text-align: left;
}
.row-btn:active { background: var(--sunken); }
.row-btn[aria-pressed="true"] { background: var(--ok-bg); }
.row-text { min-width: 0; }
.row-main { font-size: 17px; font-weight: 600; line-height: 1.3; overflow-wrap: anywhere; }
.row-sub { font-size: 13px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.row-sub b { color: var(--ink); font-weight: 700; }
.phones { display: flex; flex-wrap: wrap; gap: 0 14px; }
.phones span { white-space: nowrap; }
.row-side { flex: none; white-space: nowrap; }

.note { margin: 8px 0 0; padding: 10px 12px; border-radius: 10px; font-size: 14px; overflow-wrap: anywhere; }
.note.ok { background: var(--ok-bg); color: var(--ok-ink); }
.note.warn { background: var(--warn-bg); color: var(--warn-ink); }
.note.err { background: var(--err-bg); color: var(--err-ink); }
.muted { color: var(--ink-2); font-size: 14px; }
.nb { white-space: nowrap; }

/* 称重屏 */
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.chip {
  position: relative; display: inline-flex; align-items: center; gap: 6px;
  padding: 3px 10px; border: 0; border-radius: 999px; font-size: 13px; font-weight: 600;
  background: var(--ok-bg); color: var(--ok-ink);
}
.chip::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.chip::after { content: ""; position: absolute; inset: -9px -4px; }   /* 把可点范围撑到 44px 高 */
.chip.warn { background: var(--warn-bg); color: var(--warn-ink); }
.chip.err { background: var(--err-bg); color: var(--err-ink); }

.scale {
  container-type: inline-size;
  padding: 14px 16px 12px; border-radius: 16px;
  background: var(--sunken); border: 2px solid var(--line);
}
.scale[data-state="recorded"] { border-color: var(--accent); background: var(--ok-bg); }
.scale[data-state="hold"] { border-color: var(--warn-ink); background: var(--warn-bg); }
.scale[data-state="off"] { border-color: var(--err-ink); background: var(--err-bg); }
.scale[data-state="locked"] .weight { opacity: 0.3; }
.scale[data-state="unstable"] #weight { color: var(--ink-2); }
.scale-top { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; font-weight: 600; color: var(--ink-2); }
.scale[data-state="recorded"] #stateText { color: var(--ok-ink); }
.scale[data-state="off"] #stateText { color: var(--err-ink); }
.scale[data-state="hold"] #stateText { color: var(--warn-ink); }
.scale-off { display: grid; gap: 10px; padding: 18px 0 6px; }
.scale-off .btn { min-height: 64px; font-size: 19px; background: var(--surface); border-color: var(--err-ink); color: var(--err-ink); }
.step-card.solo { margin: 0 0 14px; padding: 0 12px 14px; }
.tare-pick { display: grid; gap: 8px; }
.tare-pick .weigh-tare { min-height: 52px; font-size: 17px; border-width: 1.5px; }
.tare-pick .weigh-tare:disabled { background: transparent; border: 1.5px dashed var(--edge); color: var(--ink-2); }
.weigh-tare .r { display: inline-block; min-width: 4.2em; text-align: left; font-variant-numeric: tabular-nums; }
.badge {
  display: inline-grid; place-items: center; min-width: 22px; height: 22px; margin-left: 6px; padding: 0 6px;
  border-radius: 11px; background: var(--warn-ink); color: #fff; font-size: 13px; font-weight: 700; vertical-align: 1px;
}
.btn.warnfix { background: var(--warn-bg); border-color: var(--warn-ink); color: var(--warn-ink); }
.preview { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 10px 12px; margin: 0 0 12px; border-radius: 10px; background: var(--sunken); font-variant-numeric: tabular-nums; }
.preview b { font-size: 20px; display: inline-block; min-width: 3.6em; text-align: right; }
.preview s { color: var(--ink-2); }
.tagline { display: inline-block; padding: 1px 8px; border-radius: 6px; font-size: 13px; font-weight: 700; }
.tagline.warn { background: var(--warn-bg); color: var(--warn-ink); }
.tagline.ok { background: var(--ok-bg); color: var(--ok-ink); }
td .btn.small { min-height: 40px; }
/* 手机尾号：4 个格子，一眼看出只要 4 位 */
.otp { position: relative; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; max-width: 286px; margin: 0 0 4px; }
.otp input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; font-size: 16px; caret-color: transparent; border: 0; }
.otp .cell {
  height: 64px; display: grid; place-items: center; border: 1.5px solid var(--edge); border-radius: 14px;
  background: var(--surface); font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums;
}
.otp:focus-within .cell.cur { border: 2px solid var(--accent); box-shadow: 0 0 0 3px rgba(11, 107, 58, 0.18); }
.otp:focus-within .cell.cur:empty::after { content: ""; width: 2px; height: 28px; background: var(--accent); }
.weight {
  display: flex; align-items: baseline; justify-content: flex-end; gap: 6px;
  font-variant-numeric: tabular-nums; font-feature-settings: "tnum";
  font-size: min(84px, 25cqi); font-weight: 700; line-height: 1.1; letter-spacing: -0.02em;
  white-space: nowrap;
}
.weight small { font-size: 26px; font-weight: 600; letter-spacing: 0; color: var(--ink-2); }
.tare-line { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 10px; }
.tare-line .muted { min-width: 0; overflow-wrap: anywhere; }

.event { margin: 12px 0 0; padding: 12px 14px; border-radius: 12px; font-size: 17px; font-weight: 600; background: var(--sunken); color: var(--ink-2); overflow-wrap: anywhere; }
.event.ok { background: var(--ok-bg); color: var(--ok-ink); }
.event.warn { background: var(--warn-bg); color: var(--warn-ink); }
.event.err { background: var(--err-bg); color: var(--err-ink); }
.event .btn { display: block; width: 100%; margin-top: 10px; }

.stepper { flex: none; display: flex; align-items: center; gap: 10px; }
.stepper button {
  width: 48px; height: 48px; border-radius: 12px; border: 1.5px solid var(--edge);
  background: var(--surface); font-size: 24px; font-weight: 600; line-height: 1;
  transition: transform 120ms var(--ease-out);
}
.stepper button:active { transform: scale(0.97); background: var(--sunken); }
.stepper output { min-width: 64px; text-align: center; font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.between { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.between > :first-child { min-width: 0; }

.totals { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; margin-top: 14px; }
.stat { padding: 10px 14px; border: 1px solid var(--line); border-radius: 12px; }
.stat dt { font-size: 13px; color: var(--ink-2); }
.stat dd { margin: 0; font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.25; }
.stat dd small { font-size: 15px; font-weight: 600; color: var(--ink-2); }

/* —— 称重页：沿用第 2 页的字号层级；称重框是主角，下面是最近几箱 —— */
.scr-weigh .topbar { padding: 14px 16px 12px; }
.scr-weigh .topbar h1 { font-size: 19px; line-height: 1.35; }
.scr-weigh .topbar p { font-size: 15px; margin-top: 2px; }
.scr-weigh .chips { margin-top: 10px; }
.scr-weigh .scale { padding: 14px 16px; border-radius: 18px; }
.scr-weigh .scale-top { font-size: 15px; }
.scr-weigh .weight { font-size: min(96px, 28cqi); margin: 2px 0 4px; }
.scale[data-state="idle"] #weight, .scale[data-state="unstable"] #weight { color: #9aa29e; }
.scale-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 52px; border-top: 1px solid rgba(20, 24, 26, 0.08); }
.scale-row .k { font-size: 15px; color: var(--ink-2); flex: none; }
.scale-row .v { flex: 1; min-width: 0; font-size: 17px; font-weight: 600; overflow-wrap: anywhere; }
.scale-row .btn.small { min-height: 40px; padding: 4px 14px; }
.scale-row .stepper { gap: 8px; }
.scale-row .stepper button { width: 44px; height: 40px; font-size: 22px; background: transparent; }
.scale-row .stepper output { min-width: 40px; font-size: 19px; }
.recent { margin-top: 18px; }
.recent-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; min-height: 44px; }
.recent-head { align-items: flex-start; padding-top: 4px; }
.recent-stats { display: flex; flex-direction: column; min-width: 0; }
.recent-head .sum { font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.35; }
.avg { display: flex; align-items: baseline; gap: 8px; font-variant-numeric: tabular-nums; line-height: 1.5; }
.avg .k { font-size: 15px; color: var(--ink-2); }
.avg b { font-size: 19px; font-weight: 700; }
.avg .raw { font-size: 13px; color: var(--ink-2); }
.avg.zero, .avg.zero b { color: #9aa29e; }
.recent-head .btn.small { align-self: center; }
.recent-head .btn.small { min-height: 40px; padding: 4px 12px; border: 0; background: none; color: var(--ok-ink); font-size: 15px; }
.recent .list { margin-top: 4px; border-radius: 14px; }
.box-row { display: grid; grid-template-columns: 4.5em minmax(0, 1fr) auto; align-items: center; gap: 10px; min-height: 52px; padding: 6px 8px 6px 14px; }
.box-row .seq { font-size: 15px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.box-row .net { font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; }
.box-row .net .p { margin-left: 8px; font-size: 13px; font-weight: 600; color: var(--ink-2); }
.box-row .net .p.no { color: var(--warn-ink); }

<main class="stage">

<script>
/* ============ 数据 ============
   演示数据里 240/480 规格的标准净含量和基准价是为演示编的。
   最坏情况是把每个字段换成现实中可能出现的最难看的值，用来找界面的破绽。 */

/* 均重取整：tC 为累计净重（单位 0.01kg），n 为箱数；只算一处，称重页实时均重和计价共用 */
function roundW(tC, n) {
  const d = n * 100;
  if (SETTINGS.round === 'floor') return Math.floor(tC / d);
  if (SETTINGS.round === 'ceil') return Math.floor((tC + d - 1) / d);
  return Math.floor((2 * tC + d) / (2 * d));   // 四舍五入，.5 进位
}

/* 计价：均重按系统设置取整到整数 kg，价格和金额四舍五入到分。真系统里这一段只在后端实现。 */
function pricing() {
  const count = S.boxes.length, sp = spec(), rule = boundRule();
  if (!count) return { count, sp, rule };
  const tC = totalC();
  const W = roundW(tC, count);
  const out = { count, tC, W, sp, rule };
  if (sp.m0 == null || !rule) return out;
  const X = Math.round((W - sp.w0) * 100) / 100;
  const Y = Math.round(rule.n * X * 100) / 100;
  const M = Math.round((sp.m0 + Y) * 100) / 100;
  return { ...out, X, Y, M, amount: Math.round(count * M * 100) / 100 };
}

function sameWeightGroups() {
  const map = new Map();
  S.boxes.forEach((b) => map.set(b.netC, (map.get(b.netC) || 0) + 1));
  return [...map.entries()].sort((a, b) => b[1] - a[1] || b[0] - a[0]);
}

function fakeQR(text) { // 只是占位图案，不是真的二维码
  let h = 2166136261;
  for (const ch of text) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); }
  let cells = '';
  for (let y = 0; y < 17; y++) for (let x = 0; x < 17; x++) {
    h ^= h << 13; h ^= h >>> 17; h ^= h << 5;
    const corner = (x < 5 && y < 5) || (x > 11 && y < 5) || (x < 5 && y > 11);
    const on = corner ? (x % 12 === 0 || x % 12 === 4 || y % 12 === 0 || y % 12 === 4 || (x % 12 === 2 && y % 12 === 2)) : (h & 1);
    if (on) cells += `<rect x="${x}" y="${y}" width="1" height="1"/>`;
  }
  return `<svg viewBox="0 0 17 17" role="img" aria-label="二维码 ${esc(text)}" shape-rendering="crispEdges">${cells}</svg>`;
}

/* ============ 记录一次称重（一次可以是 k 箱，平摊成 k 条流水） ============ */
function makeBoxes(netC, k, tareC, tareName, extra = {}) {
  const perNet = Math.round(netC / k), perTare = Math.round(tareC / k);
  const group = ++S.groupSeq, out = [];
  for (let i = 0; i < k; i++) {
    const last = i === k - 1;
    out.push({
      seq: 0, group,
      netC: last ? netC - perNet * (k - 1) : perNet,       // 零头记入最后一箱
      tareC: last ? tareC - perTare * (k - 1) : perTare,
      tareName, printed: false, manual: false, rawC: null, grossC: null, unitC: null, ...extra,
    });
  }
  return out;
}
const renumber = () => S.boxes.forEach((b, i) => { b.seq = i + 1; });
function addWeighing(netC, k, tareC, tareName, extra) {
  const added = makeBoxes(netC, k, tareC, tareName, extra);
  S.boxes.push(...added); renumber();
  return added;
}
/* 合并称重：按重量识别箱数。取每箱净重最接近标准净含量的 k；
   相邻两个箱数下每箱净重都在标准 ±10% 以内时，算“识别不准”，交给磅秤员二选一 */
function detectK() {
  const T = HW.tareUnitC || 0, G = HW.readingC, W0 = spec().w0 * 100;
  if (G - T < 500) return { k: 1, amb: null };
  let best = null; const ok = [];
  for (let k = 1; k <= 8; k++) {
    const dev = Math.abs((G - k * T) / k - W0);
    if (!best || dev < best.dev) best = { k, dev };
    if (dev * 10 <= W0) ok.push(k);
  }
  const nb = ok.find((k) => Math.abs(k - best.k) === 1);
  return { k: best.k, amb: best.dev * 10 <= W0 && nb ? [Math.min(best.k, nb), Math.max(best.k, nb)] : null };
}
function canRecord() {
  return S.screen === 'weigh' && HW.tareMode !== 'none' && HW.scaleOn && HW.stable && S.armed && !S.amb && dispC() >= 500;
}
const eachMode = () => SETTINGS.printMode === 'each';
function record() {
  if (!canRecord()) return;
  const netC = dispC();
  if (S.reweigh) {   // 重称：新读数替换这一箱
    const b = S.boxes.find((x) => x.seq === S.reweigh), old = b.netC;
    Object.assign(b, { netC, tareC: HW.tareUnitC, grossC: HW.readingC, unitC: HW.tareUnitC, manual: false, rawC: null, printed: false });
    const failed = eachMode() && !printLabel(b);
    S.event = { type: '', text: `第 ${b.seq} 箱已重称：${kg(netC)} kg（原 ${kg(old)} kg）` };
    S.reweigh = null; S.armed = false; S.recorded = `第 ${b.seq} 箱`;
    beep(failed ? 'warn' : 'ok'); render(); return;
  }
  const added = addWeighing(netC, S.k, HW.tareC, HW.tareName, { grossC: HW.readingC, unitC: HW.tareUnitC });
  S.armed = false; S.recorded = seqRange(added);
  const failed = eachMode() ? added.filter((b) => !printLabel(b)) : [];   // 完成后一次打印时，这里不打
  S.event = null;                       // 正常记录的反馈就是称重框变绿加提示音，不再另写一句
  beep(failed.length ? 'warn' : 'ok');
  render();
}

/* ============ 蓝牙连接 ============
   APP 记住上次连过的秤和打印机：一打开就在后台连；断了以后，只要设备回到附近就自动重连。 */
const devOf = (kind, id) => NEARBY[kind].find((d) => d.id === id);
const inRange = (kind, d) => (d.mine ? HW[kind === 'scale' ? 'scaleRange' : 'printerRange'] : true);
const reachable = (kind, id) => { const d = id && devOf(kind, id); return !!(HW.bt && HW.perm && d && inRange(kind, d)); };
const linkedDev = (kind) => (HW[kind === 'scale' ? 'scaleOn' : 'printerOn'] ? devOf(kind, HW.link[kind].paired) : null);
function connect(kind, id) {
  const L = HW.link[kind], gen = HW.gen;
  L.status = 'connecting'; L.target = id;
  syncLinks(); render();
  setTimeout(() => {
    if (gen !== HW.gen) return;
    if (reachable(kind, id)) {
      L.status = 'connected'; L.paired = id;
      if (kind === 'scale') {
        const d = devOf('scale', id);
        HW.readingC = d.mine ? HW.loadC : d.staticC; HW.stable = true;
        S.armed = HW.readingC - HW.tareC < 500;   // 连上时秤上已经有东西，要先拿下再放，免得重复记
        S.recorded = null;
      }
      if (S.scan === kind) S.scan = null;
    } else L.status = L.paired ? 'lost' : 'idle';
    syncLinks(); render();
  }, 1000);
}
function syncLinks() {
  let dropped = false;
  ['scale', 'printer'].forEach((kind) => {
    const L = HW.link[kind];
    if (L.status === 'connected' && !reachable(kind, L.paired)) { L.status = 'lost'; dropped = dropped || kind === 'scale'; }
    if (L.status === 'lost' && reachable(kind, L.paired) && !L.retry) {
      const gen = HW.gen;
      L.retry = setTimeout(() => { L.retry = null; if (gen === HW.gen && L.status === 'lost') connect(kind, L.paired); }, 1500);
    }
  });
  HW.scaleOn = HW.bt && HW.perm && HW.link.scale.status === 'connected';
  HW.printerOn = HW.bt && HW.perm && HW.link.printer.status === 'connected';
  if (dropped && S.screen === 'weigh') beep('warn');
  return dropped;
}
function startLinks() { ['scale', 'printer'].forEach((kind) => { if (HW.link[kind].paired) connect(kind, HW.link[kind].paired); }); }
/* 每台设备任何时候只给一个操作，按钮本身就是下一步 */
function linkAction(kind) {
  if (!HW.bt) return { label: '打开蓝牙', act: 'btOn' };
  if (!HW.perm) return { label: '允许使用蓝牙', act: 'permGrant' };
  const L = HW.link[kind];
  if (L.status === 'connected') return null;
  if (L.status === 'connecting') return { busy: true, label: '正在连接…' };
  if (!L.paired) return { label: kind === 'scale' ? '搜索秤' : '搜索打印机', act: 'scan', v: kind };
  return { label: '重新搜索', act: 'scan', v: kind };
}
function actionBtn(a, small) {
  if (!a) return '';
  const cls = small ? 'btn small' : 'btn primary big';
  if (a.busy) return `<button class="${cls}" disabled><span class="spin" aria-hidden="true"></span>${a.label}</button>`;
  return `<button class="${cls}" data-act="${a.act}" ${a.v ? `data-v="${a.v}"` : ''}>${a.label}</button>`;
}

function tick() {
  if (syncLinks()) render();
  const sd = linkedDev('scale');
  if (sd && !sd.mine) { HW.readingC = sd.staticC; HW.stable = true; }
  else if (!HW.stable) {
    if (Date.now() >= HW.settleAt) { HW.readingC = HW.loadC; HW.stable = true; if (S.sheet === 'tare') renderSheet(); }
    else HW.readingC = HW.loadC + Math.round((Math.random() - 0.5) * 12) * 10;
  }
  if (HW.scaleOn && HW.stable && HW.readingC - (HW.tareUnitC || 0) < 500) { S.armed = true; S.recorded = null; }   // 台面空了，才允许记下一次
  if (S.screen === 'weigh' && !S.sheet && HW.scaleOn && HW.stable && S.armed && HW.tareMode !== 'none') {
    const d = S.reweigh ? { k: 1, amb: null } : detectK();   // 等待记录时按重量识别箱数
    if (d.k !== S.k || String(d.amb) !== String(S.amb)) {
      S.k = d.k; S.amb = d.amb; HW.tareC = HW.tareUnitC * S.k; render();
    }
  }
  if (!S.sheet && canRecord()) record();   // 读数稳定就自动记录，不用点按钮
  live();
}
function applyTare(mode, unitC, name) {
  HW.tareMode = mode; HW.tareUnitC = unitC; HW.tareName = name;
  HW.tareC = unitC * (S.k || 1);
}

const STEPS = [

const missingSteps = () => STEPS.filter((st) => !stepValue[st.key]());
const activeStep = () => S.open || (missingSteps()[0] || {}).key || null;

  const active = activeStep(), missing = missingSteps();

    else inner = `<h2 class="step-title">${st.title}</h2>`;
    return `<li class="step" data-step="${st.key}" data-state="${state}" ${isActive ? 'aria-current="step"' : ''}>${num}${inner}</li>`;

  <div class="body"><ol class="steps">${items}</ol>

function stepHints(key) {   // 规则和基准价的提醒挂在规格这一步，因为两者都由“商品 + 规格”决定
  if (key !== 'spec') return '';

function stepSummary(key) {

const otpCells = () => [0, 1, 2, 3].map((i) => `<span class="cell ${i === Math.min(S.query.length, 3) ? 'cur' : ''}" aria-hidden="true">${esc(S.query[i] || '')}</span>`).join('');
const segCols = (items, label = (x) => x) => {   // 名字越长，一行放的越少，免得挤成竖条
  const longest = Math.max(...items.map((x) => [...label(x)].length));

  return longest > 10 ? 1 : longest > 5 ? Math.min(cols, 2) : cols;
};
function phoneHtml(p) {   // 把匹配上的后四位加粗，同名的人靠号码区分
  return S.query.length === 4 && p.replace(/\D/g, '').endsWith(S.query) ? `${esc(p.slice(0, -4))}<b>${esc(p.slice(-4))}</b>` : esc(p);
}
const fmtPhone = (p) => (/^1\d{10}$/.test(p) ? p.replace(/(\d{3})(\d{4})(\d{4})/, '$1 $2 $3') : p);
const tailHits = (q) => DATA.farmers.filter((f) => f.phones.some((p) => p.endsWith(q)));
function farmerResults() {
  if (!S.query.length) {
    const miss = S.noMatch ? `<p class="note warn" style="margin:4px 0 0">没有尾号 ${esc(S.noMatch)} 的农户</p>` : '';
    const recent = S.recent.map((id) => DATA.farmers.find((f) => f.id === id)).filter(Boolean);
    if (!recent.length) return miss;
    return `${miss}<span class="label" style="margin:18px 0 8px">最近</span><ul class="list">${recent.map((f) => `<li><button class="row-btn" data-act="farmer" data-v="${f.id}">

  }
  if (S.query.length < 4) return '';
  const hits = tailHits(S.query);
  if (!hits.length) return '';
  return `<ul class="list">${hits.map((f) => `<li><button class="row-btn" data-act="farmer" data-v="${f.id}" aria-pressed="${S.farmerId === f.id}">
    <span class="row-text"><span class="row-main">${esc(f.name)}</span><span class="row-sub phones">${f.phones.filter((p) => p.endsWith(S.query)).map((p) => `<span>${phoneHtml(fmtPhone(p))}</span>`).join('')}</span></span>

}

/* 建单页底部的设备卡片：后台自动连接的进度在这里就能看到 */
function devLine(kind) {
  const L = HW.link[kind], on = kind === 'scale' ? HW.scaleOn : HW.printerOn;

  else if (busy) [st, tone] = ['连接中', 'busy'];
  else [st, tone] = [!HW.bt ? '蓝牙未打开' : !HW.perm ? '未授权' : !L.paired ? '未配对' : '未连接', kind === 'scale' ? 'err' : 'warn'];
  const id = on ? L.paired : (busy ? L.target : L.paired);
  const model = id ? `${devOf(kind, id).model} ··${id}` : '';
  return `<button class="dev-line" data-act="openDevices"><span class="dot ${tone === 'busy' ? '' : tone}"></span><span class="name">${kind === 'scale' ? '电子秤' : '标签打印机'}</span><span class="model">${model}</span><span class="st ${tone}">${busy ? '<span class="spin" aria-hidden="true"></span>' : ''}${st}</span></button>`;
}
const devCardHtml = () => devLine('scale') + devLine('printer');
let lastDevCard = '';

const printerReady = () => HW.printerOn && HW.printerState === 'ok';
const printerIssue = () => (!HW.printerOn ? '打印机未连接' : `打印机${PRINTER_ISSUE[HW.printerState]}`);
const printWarnable = () => eachMode() || S.confirmed;   // 完成后一次打印：确认之前不算“漏打”
const unprintedCount = () => (printWarnable() ? S.boxes.filter((b) => !b.printed).length : 0);
let printTimer = null;
function stopPrint() { clearTimeout(printTimer); printTimer = null; if (S) S.printJob = null; }
function runPrintQueue() {   // 按箱序号依次打；缺纸、开盖、断开就停，剩下的保持未打印
  if (printTimer) return;
  const total = S.boxes.filter((b) => !b.printed).length;
  if (!total) return;
  S.printJob = { done: 0, total }; render();
  const step = () => {
    if (!S.printJob) { printTimer = null; return; }
    const next = S.boxes.find((b) => !b.printed);
    if (!next) { S.printJob = null; printTimer = null; render(); return; }
    if (!printerReady()) { S.printJob = null; printTimer = null; beep('warn'); render(); return; }
    printLabel(next); S.printJob.done += 1; render();
    printTimer = setTimeout(step, 260);
  };
  printTimer = setTimeout(step, 260);
}
function unprintedBlock() {   // 漏打的标签：打印机好了就给“补打”按钮，没好就给一键去看打印机
  if (S.printJob) {
    const { done, total } = S.printJob;
    return `<div class="print-prog" role="status">正在打印 ${done} / ${total}<div class="bar"><i style="width:${Math.round(done / total * 100)}%"></i></div></div>`;
  }
  const n = unprintedCount();
  if (!n) return '';
  if (printerReady()) return `<button class="btn warnfix" style="width:100%;margin-top:12px" data-act="reprintAll">补打 ${n} 张标签</button>`;
  return `<button class="btn warnfix" style="width:100%;margin-top:12px" data-act="openDevices">${n} 张标签没打出来 · ${printerIssue()}</button>`;
}
function tareChoices() {

/* 最近几箱：每放一箱都能看到“记上了没”；点任意一行可以重称、手工录入、删除 */
function printMark(b) {   // 完成后一次打印时，确认前的箱不显示打印状态（都还没到打的时候）

/* 实时批次均重：累计净重 ÷ 箱数，取整方式和计价用同一个 roundW */
function batchAvg() {

function recentBoxes() {   // 没称之前先留 4 个空位：记一箱填一格，版面从头到尾不跳

        <span class="avg ${n ? '' : 'zero'}"><span class="k">均重</span><b>${n ? `${batchAvg().W} kg` : '—'}</b>${n ? `<span class="raw">${(totalC() / n / 100).toFixed(2)}</span>` : ''}</span></span>

/* 往下拖关闭弹层（gestures）：把手和标题栏随时可拖；内容区只在滚到顶、往下拉时才接手，免得和列表滚动打架。

(function sheetDrag() {
  const el = $('sheet');

    if (!S.sheet || g || e.button > 0 || e.target.closest('button, input, select, a')) return;
    const fromHead = !!e.target.closest('.sheet-grab, .sheet-head');
    const body = el.querySelector('.sheet-body');
    if (!fromHead && body && body.scrollTop > 0) return;
    g = { id: e.pointerId, y0: e.clientY, fromHead, on: false, dy: 0, hist: [] };
  });
  el.addEventListener('pointermove', (e) => {

  });

    if (!done.on) return;

    const v = (done.dy - d0) / Math.max(1, performance.now() - t0);   // 像素/毫秒
    if (done.dy > el.offsetHeight * 0.35 || (v > 0.4 && done.dy > 24)) { closeSheet(); return; }
    el.style.transition = reduce() ? 'none' : 'transform 200ms cubic-bezier(0.23, 1, 0.32, 1)';
    el.style.transform = '';

  el.addEventListener('pointercancel', end);
})();

  if (before) {
    const now = doneKeys();
    S.justDone = now.filter((k) => !before.includes(k));
    S.justReady = before.length < STEPS.length && now.length === STEPS.length;
    if (S.justReady) { try { if (navigator.vibrate) navigator.vibrate(15); } catch (e) {} }
  }
  S.open = null; render(); focusStep();
}
function focusStep(flash) {   // 把正在填的一步滚到眼前；点“还差几步”时再轻闪一下，表示按钮听到了
  const el = document.querySelector('.step[data-state="active"]');
  if (!el) return;
  el.scrollIntoView({ block: 'nearest' });
  if (el.dataset.step === 'farmer') $('q').focus({ preventScroll: true });
  if (flash && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
    el.querySelector('.step-card').animate(
      [{ boxShadow: '0 0 0 0 rgba(11, 107, 58, 0.45)' }, { boxShadow: '0 0 0 10px rgba(11, 107, 58, 0)' }],
      { duration: 500, easing: 'cubic-bezier(0.23, 1, 0.32, 1)' });
  }
}
function newOrder() {
  stopPrint();
  Object.assign(S, { amb: null, reweigh: null, confirmed: false, screen: 'create', query: '', noMatch: '', farmerPhone: '', farmerId: null, product: null, spec: null, warehouse: S.lastWarehouse, open: null, batch: null, boxes: [], groupSeq: 0, k: 1, event: null, armed: true, recorded: null, submitError: false, sheet: null });
  applyTare('none', 0, ''); HW.caseIdx = 0;
}
const ACT = {
  farmer(v) {   // 只有一条规则时，商品和规格直接按规则填好
    const before = doneKeys();
    if (v === S.farmerId) { advance(); return; }        // 点回同一位，原样收起
    const f = DATA.farmers.find((x) => x.id === v);
    S.farmerId = v; S.noMatch = '';
    S.farmerPhone = f.phones.find((p) => S.query.length === 4 && p.endsWith(S.query)) || f.phones[0];
    const rules = farmerRules();
    if (rules.length === 1) { S.product = rules[0].product; S.spec = rules[0].spec; }
    else { S.product = null; S.spec = null; }
    advance(before);
  },
  product(v) {
    const before = doneKeys();
    S.product = v;
    const rules = farmerRules().filter((r) => r.product === v);
    if (rules.length === 1) S.spec = rules[0].spec;
    advance(before);
  },
  spec(v) { const before = doneKeys(); S.spec = v; advance(before); },
  warehouse(v) { const before = doneKeys(); S.warehouse = v; advance(before); },
  edit(v) { S.open = v; render(); focusStep(); },
  nudge() { S.open = null; render(); focusStep(true); },
  start() {
    S.lastWarehouse = S.warehouse;
    S.batch = S.batch || `SG${today().compact}-${batchSeq}`; S.screen = 'weigh'; S.event = null;
    S.armed = dispC() < 500; S.recorded = null; render();
  },
  leave() { if (S.boxes.length) openSheet('leave'); else { S.screen = 'create'; render(); } },
  abandon() { newOrder(); render(); },
  openTare() { openSheet('tare'); },
  openLog() { S.showSingles = false; openSheet('log'); },
  openRule() { openSheet('rule'); },
  openDevices() { openSheet('devices'); },
  btOn() { HW.bt = true; $('bt').checked = true; syncLinks(); render(); },
  permGrant() { HW.perm = true; $('perm').checked = true; syncLinks(); render(); },
  scan(kind) {
    if (S.sheet !== 'devices') openSheet('devices');
    S.scan = kind; S.scanning = true; renderSheet();
    const gen = HW.gen;
    setTimeout(() => { if (gen === HW.gen) { S.scanning = false; renderSheet(); } }, 1200);
  },
  connect(v) { const [kind, id] = v.split(':'); connect(kind, id); },
  testPrint() {
    if (!printerReady()) { beep('warn'); return; }
    if (!linkedDev('printer').mine) { $('printCount').textContent = `另一台打印机（··${HW.link.printer.paired}）出了一张测试标签`; return; }
    $('sticker').className = 'sticker';
    $('sticker').innerHTML = `<div><b>测试标签</b><br>GP-M32B ··${HW.link.printer.paired}<br>${today().dotted}</div>${fakeQR('TEST')}`;
  },
  closeSheet() { closeSheet(); },
  toggleSingles() { S.showSingles = !S.showSingles; renderSheet(); },
  tareDigital(v) { const t = DATA.tares.find((x) => x.id === v); applyTare('digital', t.c, t.name); S.lastTare = t.id; closeSheet(); render(); },
  tareWeigh() { S.k = 1; applyTare('weigh', HW.readingC, '空箱'); closeSheet(); render(); },
  chooseK(v) { S.k = Number(v); S.amb = null; HW.tareC = HW.tareUnitC * S.k; record(); },
  openBox(v) { if (S.screen !== 'weigh') return; openSheet('box'); S.boxSeq = Number(v); S.boxMode = null; renderSheet(); },
  reweigh() { S.reweigh = S.boxSeq; S.amb = null; closeSheet(); render(); },
  cancelReweigh() { S.reweigh = null; render(); },
  manualEdit() { const b = S.boxes.find((x) => x.seq === S.boxSeq); S.boxMode = 'manual'; S.boxInput = kg(b.netC); renderSheet(); $('boxIn').focus(); $('boxIn').select(); },
  manualAdd() { openSheet('box'); S.boxSeq = null; S.boxMode = 'add'; S.boxInput = ''; renderSheet(); $('boxIn').focus(); },
  boxCancel() { if (S.boxMode === 'add') closeSheet(); else { S.boxMode = null; renderSheet(); } },
  boxSave() {
    const val = Math.round(parseFloat(S.boxInput) * 100);
    if (S.boxMode === 'add') {
      const [b] = addWeighing(val, 1, HW.tareUnitC || 0, HW.tareName || '', { manual: true });
      if (eachMode()) printLabel(b);
      S.event = { type: '', text: `已手工加第 ${b.seq} 箱：${kg(val)} kg` };
    } else {
      const b = S.boxes.find((x) => x.seq === S.boxSeq);
      if (!b.manual) b.rawC = b.netC;   // 秤的原始读数只记第一次的
      Object.assign(b, { netC: val, manual: true, printed: false });
      if (eachMode()) printLabel(b);
      S.event = { type: '', text: `第 ${b.seq} 箱已改为 ${kg(val)} kg（手录）` };
    }
    closeSheet(); render();
  },
  boxDelete() {   // 合并称重的几箱作为一组整体删除
    const b = S.boxes.find((x) => x.seq === S.boxSeq), grp = S.boxes.filter((x) => x.group === b.group);
    const text = `已删除${seqRange(grp)}（${kg(grp.reduce((s, x) => s + x.netC, 0))} kg）`;
    S.boxes = S.boxes.filter((x) => x.group !== b.group); renumber();
    S.event = { type: '', text }; S.recorded = null; closeSheet(); render();
  },
  regroup(v) {   // 识别错了：按新的箱数重新均摊这一次称重
    const k = Number(v), b = S.boxes.find((x) => x.seq === S.boxSeq), grp = S.boxes.filter((x) => x.group === b.group);
    if (k === grp.length) return;
    const i0 = S.boxes.indexOf(grp[0]), T = grp[0].unitC;
    const fresh = makeBoxes(grp[0].grossC - k * T, k, T * k, grp[0].tareName, { grossC: grp[0].grossC, unitC: T });
    S.boxes.splice(i0, grp.length, ...fresh); renumber();
    if (eachMode()) fresh.forEach((x) => printLabel(x));
    S.event = { type: '', text: `这一次称重改为 ${k} 箱：${seqRange(fresh)}` }; S.recorded = null;
    closeSheet(); render();
  },
  reprint(v) {
    const b = S.boxes.find((x) => x.seq === Number(v));
    if (!printLabel(b)) beep('warn');
    render();
  },
  reprintAll() { runPrintQueue(); },
  finish() {   // 确认计量完毕：锁定流水、算价；按设置一次性打印
    S.confirmed = true; S.screen = 'summary'; S.submitError = false; S.m0Retried = false; S.amb = null; render();
    if (!eachMode()) runPrintQueue();
  },
  back() { stopPrint(); S.confirmed = false; S.screen = 'weigh'; S.event = null; render(); },
  ruleN(v) { const r = boundRule(); S.draftN = Math.max(0, Math.round(((S.draftN ?? r.n) + Number(v)) * 100) / 100); renderSheet(); },
  ruleRevert() { S.draftN = null; renderSheet(); },
  refreshM0() {   // 基准价由管理员在 Web 端录入，这里只能重新拉一次
    S.refreshing = true; render();
    setTimeout(() => { S.refreshing = false; S.m0Retried = spec().m0 == null; if (S.m0Retried) beep('warn'); render(); }, 700);
  },
  ruleSave() { boundRule().n = S.draftN; S.draftN = null; render(); },
  ruleChange() { S.changeRule = !S.changeRule; renderSheet(); },
  ruleUnbind() { const r = boundRule(); r.farmers = r.farmers.filter((id) => id !== S.farmerId); S.changeRule = false; render(); },
  ruleBind(v) {
    const old = boundRule();
    if (old) old.farmers = old.farmers.filter((id) => id !== S.farmerId);
    DATA.rules.find((r) => r.id === v).farmers.push(S.farmerId);
    S.changeRule = false; render();
  },
  submit() {
    S.submitting = true; S.submitError = false; render();
    setTimeout(() => {
      S.submitting = false;
      if (SESSION.expired) {   // 登录失效：先登录，登录后回到这张汇总页，单据数据不丢
        Object.assign(S, { afterLogin: 'summary', screen: 'login', lerr: 'expired', lpw: '', lphone: SESSION.lastPhone });
        closeSheet(); render(); $('lw').focus(); return;
      }
      if (HW.netDown) { S.submitError = true; beep('warn'); }
      else {
        S.screen = 'done'; S.doneAt = Date.now(); closeSheet(); beep('ok');
        try { if (navigator.vibrate) navigator.vibrate(30); } catch (e) {}
        S.recent = [S.farmerId, ...S.recent.filter((id) => id !== S.farmerId)].slice(0, 5);
      }
      render();
    }, 700);
  },
  again() {
    if (Date.now() - (S.doneAt || 0) < 500) return;   // 提交按钮和这个按钮在同一位置：防止连点直接跳过完成页
    batchSeq += 1; newOrder(); render(); focusStep();
  },
  focusField(id) { $(id).focus(); },
  togglePw() {
    S.showPw = !S.showPw; const w = $('lw'), pos = w.selectionStart;
    w.type = S.showPw ? 'text' : 'password'; w.focus(); try { w.setSelectionRange(pos, pos); } catch (e) {}
    const b = document.querySelector('[data-act="togglePw"]'); b.innerHTML = EYE(!S.showPw); b.setAttribute('aria-label', S.showPw ? '隐藏密码' : '显示密码');
  },
  login() {
    S.lbusy = true; $('lfoot').innerHTML = loginBtn();
    setTimeout(() => {
      S.lbusy = false;
      const acct = ACCOUNTS.find((a) => a.phone === S.lphone);
      if (HW.netDown) S.lerr = 'net';                                   // 连不上：密码留着
      else if (!acct || acct.pw !== S.lpw) { S.lerr = 'bad'; S.lpw = ''; beep('warn'); }
      else if (acct.role !== 'scale') S.lerr = 'admin';
      else {
        Object.assign(SESSION, { user: acct.phone, lastPhone: acct.phone, expired: false }); saveSession();
        S.lerr = ''; S.lpw = ''; S.screen = S.afterLogin || 'create'; S.afterLogin = null;
        render();
        if (['scale', 'printer'].every((k) => HW.link[k].status !== 'connected' && HW.link[k].status !== 'connecting')) startLinks();
        if (S.screen === 'create') focusStep();
        return;
      }
      render();
      if (S.lerr === 'bad') $('lw').focus();
    }, 700);
  },
  openAccount() { openSheet('account'); },
  logout() {
    SESSION.user = null; saveSession();
    HW.gen += 1; ['scale', 'printer'].forEach((k) => { HW.link[k].status = 'idle'; }); syncLinks();
    closeSheet();
    Object.assign(S, { screen: 'login', lphone: SESSION.lastPhone, lpw: '', lerr: '', afterLogin: null });
    render(); $('lw').focus();
  },
};

function resetAll() {
  batchSeq = 1; freshState();
  ['bt', 'perm', 'scaleRange', 'printerRange', 'sound'].forEach((id) => { $(id).checked = true; });
  $('netDown').checked = false; $('battLow').checked = false; $('printerState').value = 'ok';
  $('weightSource').value = 'case'; $('placeN').value = '1';
  stopPrint(); SETTINGS = { ...SETTINGS_DEFAULT }; $('setRound').value = SETTINGS.round; $('setPrint').value = SETTINGS.printMode;
  $('printCount').textContent = '还没有打印';
  $('sticker').className = 'sticker-empty'; $('sticker').textContent = '最近打印的标签会显示在这里';
  syncToggle(); render(); if (me()) startLinks();
}
const HWACT = {
  logoutBench() { if (me()) ACT.logout(); },
  expire() { if (me()) { SESSION.expired = true; saveSession(); } },
  setM0() { DATA.specs.forEach((sp) => { if (sp.m0 == null) sp.m0 = Math.round(sp.w0 * 4); }); },
  unpair() {
    HW.gen += 1;
    ['scale', 'printer'].forEach((k) => { HW.link[k] = { paired: null, status: 'idle' }; });
    syncLinks(); render();
  },
  next() {
    const v = $('placeN').value, heavy = v === '5h', n = heavy ? 5 : Number(v);
    let total = 0;
    for (let i = 0; i < n; i++) {
      const net = heavy ? 4900
        : n === 1 && $('weightSource').value === 'case' ? CASE_NETS_C[HW.caseIdx++ % CASE_NETS_C.length]
        : 4450 + Math.round(Math.random() * 30) * 10;
      total += net + BOX_KG_C;
    }
    const place = () => setLoad(total, `${n} 箱，毛重 ${kg(total)}kg`);
    if (HW.loadC > 0) { setLoad(0, '空'); setTimeout(place, 1100); } else place();   // 先拿走上一箱，再放新的
  },
  remove() { setLoad(0, '空'); },
  empty() { setLoad(BOX_KG_C, '一只空箱，2kg'); },
  reset: resetAll,
};

function syncToggle() {
  document.querySelectorAll('[data-mode]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.mode === MODE)));
  document.querySelector('[data-big]').setAttribute('aria-pressed', String(BIG));
  $('phone').toggleAttribute('data-large', BIG);
}

document.addEventListener('click', (e) => {
  const mode = e.target.closest('[data-mode]');
  if (mode) { MODE = mode.dataset.mode; savePref(); resetAll(); return; }
  if (e.target.closest('[data-big]')) { BIG = !BIG; savePref(); syncToggle(); return; }
  const hw = e.target.closest('[data-hw]');
  if (hw) { HWACT[hw.dataset.hw](); return; }
  const el = e.target.closest('[data-act]');
  if (el && !el.disabled) ACT[el.dataset.act](el.dataset.v);
});
document.addEventListener('input', (e) => {
  if (e.target.id === 'lp' || e.target.id === 'lw') { loginInput(e); return; }
  if (e.target.id === 'boxIn') { S.boxInput = e.target.value.trim(); $('boxSaveWrap').innerHTML = boxSaveBtn(); return; }
  if (e.target.id === 'q') {
    S.query = e.target.value.replace(/\D/g, ''); e.target.value = S.query; S.noMatch = '';
    $('otpCells').innerHTML = otpCells();
    $('results').innerHTML = farmerResults();
    if (S.query.length < 4) return;
    const hits = tailHits(S.query);
    if (hits.length === 1) { ACT.farmer(hits[0].id); return; }
    if (hits.length > 1) { e.target.blur(); return; }
    const otp = $('otp'), missed = S.query;
    otp.classList.add('bad'); beep('warn');
    setTimeout(() => {
      if (S.query !== missed || !$('q')) return;
      S.query = ''; S.noMatch = missed; $('q').value = '';
      otp.classList.remove('bad');
      $('otpCells').innerHTML = otpCells(); $('results').innerHTML = farmerResults(); $('q').focus();
    }, 450);
  }
});
document.addEventListener('change', (e) => {
  const id = e.target.id;
  if (['bt', 'perm', 'scaleRange', 'printerRange', 'battLow', 'sound', 'netDown'].includes(id)) {
    HW[id] = e.target.checked;
    syncLinks(); render();
  }
  if (id === 'printerState') { HW.printerState = e.target.value; render(); }
  if (id === 'setRound') { SETTINGS.round = e.target.value; render(); }
  if (id === 'setPrint') { SETTINGS.printMode = e.target.value; render(); }
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && S.sheet) closeSheet();
  if (e.key === 'Enter' && e.target.id === 'boxIn' && validKg(S.boxInput)) { e.preventDefault(); ACT.boxSave(); }
  if (e.key === 'Enter' && (e.target.id === 'lp' || e.target.id === 'lw')) { e.preventDefault(); const b = $('lfoot').querySelector('button:not([disabled])'); if (b) b.click(); }
});

freshState();
syncToggle();
render();
if (me()) startLinks();
setInterval(tick, 100);
</script>
