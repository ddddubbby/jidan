// 佳博 SDK2 开发包原文。改动：删去对 publish.gradle 的引用（开发包里没有该文件）；compileSdk 34 改 35。16KB 对齐配置为开发包自带。
apply plugin: 'com.android.library'
version = '2.1.3'
description = 'Android serialport api from google'

android {
    namespace 'com.gainscha.serialport'
    compileSdk 35

    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
        
        externalNativeBuild {
            cmake {
                // 16KB 页面大小支持：添加链接器标志
                arguments "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON"
            }
        }
        
        // 16KB 页面大小支持
        ndk {
            // 暂时只构建 arm64-v8a
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    externalNativeBuild {
        cmake {
            path 'CMakeLists.txt'
            version "3.22.1"
        }
    }
    
    // 16KB 页面大小支持配置
    packaging {
        jniLibs {
            useLegacyPackaging = false
        }
    }
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar"])
}